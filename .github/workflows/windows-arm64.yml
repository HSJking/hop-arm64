name: Windows ARM64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-arm64.yml'
      - 'apps/**'
      - 'third_party/rhwp'
      - 'pnpm-lock.yaml'
      - 'config/rhwp-upstream.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $version = (Get-Content config/rhwp-upstream.json | ConvertFrom-Json).rustToolchain
          rustup toolchain install $version --profile minimal --target aarch64-pc-windows-msvc
          "RUSTUP_TOOLCHAIN=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test desktop on ARM64
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --target aarch64-pc-windows-msvc
      - name: Build ARM64 installer
        run: pnpm --filter hop-desktop tauri build --target aarch64-pc-windows-msvc --bundles nsis
      - name: Verify executable architecture
        shell: pwsh
        run: |
          $path = 'apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/hop-desktop.exe'
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0xaa64) {
            throw 'The executable is not a Windows ARM64 PE binary.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: HOP-windows-arm64-nsis
          path: apps/desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
